<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>달이의 조달 퀘스트</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070b1c;color:#fff;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none;overflow:hidden}
:root{--bar:min(25vw,108px)}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#stage{--u:4px;position:relative;flex:none;width:min(100vw,calc((100vh - var(--bar))*9/16));width:min(100vw,calc((100dvh - var(--bar))*9/16));aspect-ratio:9/16;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#0a1030;font-size:calc(var(--u)*4)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*2.4) calc(var(--u)*3);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);pointer-events:none}
#hud[hidden]{display:none}
#top{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:calc(var(--u)*5);text-shadow:0 2px 0 #000}
#hearts i{font-style:normal;color:#ff4d6a;margin-right:2px}
#hearts i.off{color:#3a4466}
#chap{color:#ffd34d;font-size:calc(var(--u)*4)}
#score{font-variant-numeric:tabular-nums;min-width:calc(var(--u)*16);text-align:right}
#panel{background:rgba(10,16,48,.85);border:2px solid #35b8f0;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);display:flex;align-items:center;gap:calc(var(--u)*2);min-height:calc(var(--u)*13)}
#panel .who{font-weight:800;font-size:calc(var(--u)*4.2);color:#7fd8ff;white-space:nowrap}
#panel .chips{display:flex;gap:calc(var(--u)*1.6);flex-wrap:wrap;flex:1}
#panel .cnt{font-size:calc(var(--u)*3.2);color:#a9b8de;white-space:nowrap}
.chip{display:flex;align-items:center;gap:calc(var(--u)*1);background:#16224f;border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.8) calc(var(--u)*1.6);font-weight:800;font-size:calc(var(--u)*4.4)}
.chip img{width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);image-rendering:pixelated;border-radius:3px}
.chip.ok{opacity:.45}
#panel .tip{font-size:calc(var(--u)*3.6);color:#ffd34d;font-weight:800}
#gauge{position:relative;height:calc(var(--u)*3.4);background:rgba(10,16,48,.85);border:2px solid #7a6a2a;border-radius:calc(var(--u)*2);overflow:hidden}
#gauge i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff9a3a,#ffd34d)}
#gauge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.6);color:#fff;text-shadow:0 1px 0 #000;letter-spacing:.1em}
#gauge.on{border-color:#ffd34d;animation:glow .3s linear infinite alternate}
#tm{height:calc(var(--u)*1.8);background:rgba(10,16,48,.85);border-radius:calc(var(--u));overflow:hidden}
#tm i{display:block;height:100%;width:0;background:#4be08a}
#tm.low i{background:#ff4d6a}
#mult{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*34);font-weight:900;font-size:calc(var(--u)*10);color:#ffd34d;text-shadow:0 3px 0 #000,0 0 8px #ff7a1a;pointer-events:none}
#mult.b,#score.b{animation:bump .25s ease-out}
#score{display:inline-block;transform-origin:100% 50%}#mult{transform-origin:100% 50%}
#pops{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:calc(var(--u)*5);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;animation:pop .8s ease-out forwards}
.pop.bad{color:#ff6b7f}.pop.gold{color:#ffd34d}.pop.dim{color:#cfd8f0}.pop.huge{font-size:calc(var(--u)*8)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:calc(var(--u)*8);line-height:1.2;color:#ffd34d;text-shadow:0 3px 0 #000,0 0 10px #000;pointer-events:none;opacity:0;padding:0 calc(var(--u)*3)}
#banner.on{animation:banner 1.3s ease-out forwards}
#talk{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:36%;background:rgba(8,14,44,.95);border:3px solid #ffd34d;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);display:flex;gap:calc(var(--u)*2.6);align-items:flex-start;min-height:calc(var(--u)*34)}
#talk[hidden]{display:none}
#face{flex:none;width:calc(var(--u)*17);height:calc(var(--u)*17);image-rendering:pixelated;background:#16224f;border-radius:calc(var(--u)*2);border:2px solid #35b8f0}
#talk .tx{flex:1;text-align:left}
#tname{display:block;font-weight:900;font-size:calc(var(--u)*4.2);color:#7fd8ff;margin-bottom:calc(var(--u)*1)}
#ttext{font-size:calc(var(--u)*4.3);line-height:1.5;font-weight:600;word-break:keep-all}
#tnext{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*1.6);font-size:calc(var(--u)*3);color:#ffd34d;animation:glow .5s linear infinite alternate}
#skip{position:absolute;right:0;top:calc(var(--u)*-11);background:rgba(8,14,44,.9);border:2px solid #5b6aa0;border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.6) calc(var(--u)*3);font-size:calc(var(--u)*3.4);color:#c9d4f2}
#bar{flex:none;height:var(--bar);width:min(100vw,calc((100vh - var(--bar))*9/16));width:min(100vw,calc((100dvh - var(--bar))*9/16));display:flex;align-items:center;justify-content:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 14px;background:#070b1c;touch-action:none;-webkit-user-select:none;user-select:none}
#lb{margin-right:auto;display:flex;gap:8px}
#mute,#pz{background:#141c3f;border:2px solid #35467a;border-radius:12px;padding:10px 10px;font-size:13px;color:#a9b8de}
#pz[hidden]{display:none}
#pad{display:flex;gap:14px}
#pad[hidden]{display:none}
#pad button{width:calc(var(--bar) - 18px);height:calc(var(--bar) - 18px);border-radius:50%;background:rgba(53,184,240,.3);border:3px solid rgba(127,216,255,.9);color:#fff;font-size:calc(var(--bar)*.36);font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
#pad button.on{background:rgba(53,184,240,.8);transform:scale(.94)}
#ov{position:absolute;inset:0;background:rgba(6,10,30,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);padding:calc(var(--u)*6);text-align:center}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:calc(var(--u)*9.4);line-height:1.15;color:#ffd34d;text-shadow:0 3px 0 #1d3a8a}
#ov h1 small{display:block;font-size:calc(var(--u)*4);color:#7fd8ff;text-shadow:none;margin-bottom:calc(var(--u)*1.5)}
#ov p{margin:0;font-size:calc(var(--u)*3.9);line-height:1.55;color:#c9d4f2;word-break:keep-all}
#ov .btn{width:100%;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3.6);font-weight:800;font-size:calc(var(--u)*4.8);background:#35b8f0;color:#06183a}
#ov .btn:active{filter:brightness(1.3)}
#ov .btn.sub{background:#1c2a5e;color:#fff}
#ov .big{font-size:calc(var(--u)*13);font-weight:900;color:#ffd34d;line-height:1;font-variant-numeric:tabular-nums}
#ov .badge{border:3px solid #ffd34d;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.4) calc(var(--u)*5);font-weight:900;font-size:calc(var(--u)*5.4);color:#ffd34d;background:#1a2356}
#ov h2{margin:0;font-size:calc(var(--u)*6.4);color:#ffd34d;text-shadow:0 2px 0 #1d3a8a}
#ov.low{justify-content:flex-end;background:linear-gradient(rgba(6,10,30,0) 30%,rgba(6,10,30,.92) 62%)}
#ov .pcard{width:100%;background:#14204d;border:2px solid #35b8f0;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.6) calc(var(--u)*3.4);display:flex;flex-direction:column;gap:calc(var(--u)*1);text-align:left}
#ov .pcard:active{filter:brightness(1.3)}
#ov .pcard b{font-size:calc(var(--u)*5);color:#fff}
#ov .pcard span{display:flex;align-items:center;gap:calc(var(--u)*2);font-size:calc(var(--u)*3.6);color:#c9d4f2}
#ov .pcard em{font-style:normal;width:calc(var(--u)*13);color:#7fd8ff;font-weight:800}
#ov .pcard i{font-style:normal;color:#ffd34d;letter-spacing:.1em}
#ov .did{width:100%;margin:0;padding:calc(var(--u)*2.6) calc(var(--u)*3);list-style:none;background:#14204d;border-radius:calc(var(--u)*3);text-align:left;font-size:calc(var(--u)*3.3);line-height:1.7;color:#c9d4f2}
#ov .did b{color:#ffd34d}
#ov .why{color:#ff9aa8;font-weight:800}
#ov .tipb{background:#14204d;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);color:#fff}
#ov.end h1{font-size:calc(var(--u)*7)}#ov.end .big{font-size:calc(var(--u)*10)}#ov.end{gap:calc(var(--u)*2.2)}
#ov .fine{font-size:calc(var(--u)*3.2);color:#8e9cc4}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes banner{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.18)}22%{transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1) translateY(-20%)}}
@keyframes bump{0%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.5)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="top"><span id="hearts"></span><span id="chap"></span><span id="score">0</span></div>
    <div id="panel"></div>
    <div id="tm"><i></i></div>
    <div id="gauge"><i></i><b>특급 조달 게이지</b></div>
  </div>
  <div id="mult"></div>
  <div id="pops"></div>
  <div id="banner"></div>
  <div id="talk" hidden><img id="face" alt=""><div class="tx"><b id="tname"></b><span id="ttext"></span></div><button id="skip">건너뛰기</button><span id="tnext">▼ 누르면 다음</span></div>
  <div id="ov"></div>
</div>
<div id="bar"><div id="lb"><button id="mute">소리 켬</button><button id="pz" hidden>멈춤</button></div><div id="pad" hidden></div></div>
<script>
'use strict';
// 달이의 조달 퀘스트. 그림과 소리는 모두 코드로 만든다(외부 파일 없음).
const W=180,H=320,GY=H-26;
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv');cv.width=W;cv.height=H;
let g=cv.getContext('2d');g.imageSmoothingEnabled=false;
function R(c,x,y,w,h){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function fit(){stage.style.setProperty('--u',stage.clientWidth/100+'px')}
addEventListener('resize',fit);fit();
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rnd=Math.random;

// ---------- 소리 ----------
let ac,master,nbuf,mbus,mdel,mute=store.get('pps.quest.mute','0')==='1';
function audio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const c=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=mute?0:.5;master.connect(c);c.connect(ac.destination);
  {const len=ac.sampleRate*1.3|0,ir=ac.createBuffer(2,len,ac.sampleRate);for(let k=0;k<2;k++){const d=ir.getChannelData(k);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}const cv2=ac.createConvolver(),wet=ac.createGain();cv2.buffer=ir;wet.gain.value=.22;master.connect(cv2);cv2.connect(wet);wet.connect(c);
   mbus=ac.createGain();mbus.gain.value=.5;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;mbus.connect(lp);lp.connect(master);
   mdel=ac.createDelay(1);mdel.delayTime.value=.28;const fb=ac.createGain(),dw=ac.createGain();fb.gain.value=.3;dw.gain.value=.3;mdel.connect(fb);fb.connect(mdel);mdel.connect(dw);dw.connect(mbus)}const n=ac.sampleRate*.5|0;nbuf=ac.createBuffer(1,n,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d,type,when,vol,f2){const a=audio();if(!a)return;const o=a.createOscillator(),q=a.createGain(),t=a.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(vol||.12,t+.008);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d,freq,vol,when,type){const a=audio();if(!a)return;const s=a.createBufferSource(),f=a.createBiquadFilter(),q=a.createGain(),t=a.currentTime+(when||0);s.buffer=nbuf;f.type=type||'bandpass';f.frequency.value=freq;q.gain.setValueAtTime(vol||.15,t);q.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(q);q.connect(master);s.start(t);s.stop(t+d+.03)}
const PENT=[0,2,4,7,9,12,14,16,19,21,24];
const sfx={
 get(c){const m=Math.pow(2,PENT[Math.min(c-1,PENT.length-1)]/12);tone(140,.1,'sine',0,.32,50);noise(.035,3500,.1);tone(659*m,.07,'square',0,.09);tone(988*m,.26,'square',.06,.085);tone(1976*m,.2,'sine',.06,.04)},
 gold(c){const m=Math.pow(2,PENT[c%8]/12);tone(1047*m,.05,'square',0,.06);tone(1568*m,.18,'square',.045,.055);tone(3136*m,.14,'sine',.045,.03)},
 bad(){tone(160,.3,'sawtooth',0,.16,55);noise(.25,300,.25)},
 order(){tone(660,.08,'square',0,.08);tone(990,.12,'square',.09,.08)},
 done(){[523,659,784,1047].forEach((f,i)=>{tone(f,.13,'square',i*.07,.1);tone(f/2,.13,'triangle',i*.07,.1)});[1047,1319,1568].forEach(f=>{tone(f,.55,'triangle',.28,.1);tone(f*1.003,.55,'square',.28,.03)});tone(131,.5,'triangle',.28,.2);noise(.35,7000,.06,.28)},
 fever(){for(let i=0;i<8;i++)tone(523*Math.pow(2,i/6),.09,'square',i*.045,.09);noise(.5,4000,.08,.3)},
 warn(){for(let i=0;i<3;i++){tone(880,.12,'square',i*.22,.1);tone(660,.1,'square',i*.22+.11,.1)}},
 big(){tone(90,.6,'sine',0,.4,35);noise(.5,200,.35,0,'lowpass');[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.16,'square',.1+i*.08,.11));tone(1568,.7,'triangle',.6,.16);tone(2093,.7,'triangle',.6,.1);noise(.6,7000,.07,.6)},
 perf(){tone(1760,.09,'triangle',0,.12);tone(2637,.16,'triangle',.05,.1)},
 tick(){tone(1200,.05,'square',0,.07)},
 late(){tone(220,.2,'square',0,.12);tone(165,.3,'square',.15,.12)},
 talk(){tone(520,.04,'square',0,.04)},
 heart(){tone(784,.1,'triangle',0,.12);tone(1175,.2,'triangle',.1,.12)},
 end(){[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',i*.16,.14))}
};
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
// 배경 음악: 장마다 다른 8마디 곡. 오디오 시계로 예약해 화면 연출과 무관하게 박자가 일정하다.
const MAJ=[0,2,4,5,7,9,11],MIN=[0,2,3,5,7,8,10],DOR=[0,2,3,5,7,9,10];
function parseMel(str){const out=[];let p=0;for(const tk of str.trim().split(/\s+/)){const q=tk.split(':'),len=+q[1];if(q[0]!=='-')out[p]={d:+q[0],len};p+=len}return out}
const SONGS=[
 {bpm:132,root:261.63,sc:MAJ,ch:[0,4,5,3,0,4,3,4],kick:[0,8],mel:'4:2 4:2 7:2 4:2 2:4 4:4  4:2 4:2 6:2 8:2 6:4 4:4  5:2 5:2 7:2 9:2 7:4 5:4  7:2 5:2 3:2 5:2 4:6 -:2  9:2 9:2 8:2 7:2 9:4 7:4  8:2 8:2 7:2 6:2 8:4 4:4  7:2 5:2 7:2 9:2 10:4 9:4  8:2 6:2 8:2 11:2 11:6 -:2'},
 {bpm:150,root:220,sc:MIN,ch:[0,5,6,4,0,5,6,4],kick:[0,6,8,14],mel:'0:2 4:2 7:2 4:2 0:2 4:2 7:2 4:2  9:4 7:2 5:2 7:4 5:4  8:4 6:2 8:2 10:4 8:4  11:2 10:2 8:2 6:2 4:6 -:2  7:2 7:2 9:2 7:2 11:4 9:4  12:4 9:2 7:2 9:4 5:4  10:2 8:2 10:2 13:2 13:4 10:4  11:2 11:2 11:2 11:2 11:6 -:2'},
 {bpm:126,root:293.66,sc:DOR,ch:[0,3,0,6,0,3,2,4],kick:[0,6,10],mel:'4:3 7:3 4:2 3:2 4:6  3:3 5:3 7:2 5:2 3:6  4:3 7:3 9:2 8:2 7:6  6:3 8:3 6:2 4:2 6:6  9:2 -:1 9:2 -:1 8:2 7:2 9:6  10:2 -:1 10:2 -:1 9:2 7:2 5:6  9:3 11:3 9:2 6:2 4:6  4:2 6:2 8:2 11:2 11:4 8:4'},
 {bpm:144,root:329.63,sc:MAJ,ch:[0,3,4,5,3,4,0,0],kick:[0,4,8,12],mel:'0:2 2:2 4:2 7:2 9:4 7:4  10:2 9:2 7:2 5:2 7:4 5:4  8:2 6:2 4:2 6:2 8:4 11:4  9:2 7:2 5:2 7:2 9:6 -:2  10:3 10:1 9:2 7:2 10:4 12:4  11:3 11:1 10:2 8:2 11:4 13:4  14:4 11:2 9:2 11:4 9:4  7:2 9:2 11:2 14:2 14:6 -:2'}
];
for(const sg of SONGS)sg.m=parseMel(sg.mel);
function dfreq(sg,d){const o=Math.floor(d/7),i=((d%7)+7)%7;return sg.root*Math.pow(2,(sg.sc[i]+12*o)/12)}
function mv(type,f,t,dur,vol,dest,f2){const o=ac.createOscillator(),q=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(vol,t+.006);q.gain.exponentialRampToValueAtTime(vol*.55,t+Math.min(.09,dur*.5));q.gain.setValueAtTime(vol*.55,t+dur*.8);q.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(q);q.connect(dest);o.start(t);o.stop(t+dur+.02)}
function mn(t,dur,freq,vol,type){const sr=ac.createBufferSource(),fl=ac.createBiquadFilter(),q=ac.createGain();sr.buffer=nbuf;fl.type=type;fl.frequency.value=freq;q.gain.setValueAtTime(vol,t);q.gain.exponentialRampToValueAtTime(.0001,t+dur);sr.connect(fl);fl.connect(q);q.connect(mbus);sr.start(t);sr.stop(t+dur+.02)}
let mNext=0,mStep=0,mSong=-1;
const ARP=[0,2,4,7,4,2,4,7];
function mPlay(sg,i,t,sd,fv){const st=i%128,bar=st>>4,b=st&15,r=sg.ch[bar],up=fv?7:0,e=sg.m[st];
 if(e){const fq=dfreq(sg,e.d+up),du=e.len*sd*.92;mv('square',fq,t,du,.05,mbus);mv('square',fq*1.006,t,du,.028,mdel);mv('triangle',fq/2,t,du,.04,mbus)}
 if(fv||b%2===0)mv('square',dfreq(sg,r+ARP[(fv?b:b>>1)%8]+7),t,sd*.9,.016,mdel);
 const rb=r>3?r-7:r;if(b===0||b===3||b===6||b===8||b===11)mv('triangle',dfreq(sg,rb)/2,t,sd*2.4,.13,mbus);else if(b===14)mv('triangle',dfreq(sg,rb+4)/2,t,sd*1.6,.11,mbus);
 if(b===0)for(const k of [0,2,4])mv('triangle',dfreq(sg,r+k),t,sd*14,.018,mbus);

 else if(order&&!order.done&&spawnT<=0){const c=C();spawnT=Math.max(.4,c.gap-ordI*.05);const need=Object.keys(order.need).filter(k=>order.need[k]>0);
  const bp=c.bad+(endless?0:mod.bad),k=need.length&&dry>=2?need[rnd()*need.length|0]:bp&&rnd()<bp?'bad':need.length&&rnd()<.5?need[rnd()*need.length|0]:c.pool[rnd()*c.pool.length|0];
  const isNeed=need.includes(k);dry=isNeed?0:dry+1;let warn=false;if(guide&&!isNeed&&!guideWarn){guideWarn=warn=true}
  items.push({k,warn,x:8+rnd()*(W-28),y:56,v:(c.fall+(endless?0:ordI*4))*(.85+rnd()*.4)*(guide?.62:1),amp:bgI>=2||endless&&ordI>3?8+rnd()*14:0,ph:rnd()*6})}
 const by=GY-22;
 for(const it of items){it.y+=it.v*dt;
  if(!it.gold&&it.amp)it.x=Math.max(2,Math.min(W-14,it.x+Math.cos(clock*2.6+it.ph)*it.amp*2.6*dt));
  if(!it.dead&&it.y+12>=by&&it.y+12<=by+13&&Math.abs(it.x+6-P.x)<18){it.dead=true;catchIt(it)}
  if(it.y>GY-6&&!it.dead){it.dead=true;burst(it.x+6,GY-2,[it.gold?'#ffd34d':'#9aa7c7'],3,50)}}
 items=items.filter(i=>!i.dead);
 if(big){big.t+=dt;big.y+=48*dt;big.x=big.cx-14+Math.sin(big.t*2.2)*26;
  if(big.y+16>=by&&big.y+16<=by+14&&Math.abs(big.x+14-P.x)<23)bigCaught();
  else if(big.y>GY-8){burst(big.x+14,GY-4,['#9aa7c7','#fff'],10,90);pop('다시 한 번!',W/2,150,'dim');big=null;later(.7,()=>{big={k:C().big,cx:50+rnd()*80,x:0,y:40,t:0}})}}
 if(N){N.t+=dt;if(N.t>1.5)N=null}
  if(hearts<=0)gameOver()}

 dali(P.x-14,GY-52+b);
 P.stack.slice(-8).forEach((k,i)=>ITEMS[k].d(x-3+(i%4)*7,GY-31-(i>>2)*7+b));
 R('#5c3716',x-5,GY-22+b,32,2);R('#a8672f',x-4,GY-20+b,30,12-b);for(let i=0;i<5;i++)R('#8a5326',x-2+i*6,GY-20+b,1,12-b);R('#3a2410',x-1,GY-8,5,3);R('#3a2410',x+18,GY-8,5,3);

 g.save();if(shakeT>0)g.translate((rnd()*6-3)|0,(rnd()*6-3)|0);
 bg(state==='menu'?0:bgI,clock);if(portal)drawPortal(clock);

 }
 g.restore();
 if(flashT>0){g.globalAlpha=Math.max(0,flashT/flashD)*.55;R(flashC,0,0,W,H);g.globalAlpha=1}}
