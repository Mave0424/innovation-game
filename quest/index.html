<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>달이의 조달 퀘스트</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070b1c;color:#fff;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none;overflow:hidden}
:root{--bar:min(25vw,108px)}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#stage{--u:4px;position:relative;flex:none;width:min(100vw,calc((100vh - var(--bar))*9/16));width:min(100vw,calc((100dvh - var(--bar))*9/16));aspect-ratio:9/16;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#0a1030;font-size:calc(var(--u)*4)}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--u)*2.4) calc(var(--u)*3);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);pointer-events:none}
#hud[hidden]{display:none}
#top{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:calc(var(--u)*5);text-shadow:0 2px 0 #000}
#hearts i{font-style:normal;color:#ff4d6a;margin-right:2px}
#hearts i.off{color:#3a4466}
#chap{color:#ffd34d;font-size:calc(var(--u)*4)}
#score{font-variant-numeric:tabular-nums;min-width:calc(var(--u)*16);text-align:right}
#panel{background:rgba(10,16,48,.85);border:2px solid #35b8f0;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*1.6) calc(var(--u)*2.4);display:flex;align-items:center;gap:calc(var(--u)*2);min-height:calc(var(--u)*13)}
#panel .who{font-weight:800;font-size:calc(var(--u)*4.2);color:#7fd8ff;white-space:nowrap}
#panel .chips{display:flex;gap:calc(var(--u)*1.6);flex-wrap:wrap;flex:1}
#panel .cnt{font-size:calc(var(--u)*3.2);color:#a9b8de;white-space:nowrap}
.chip{display:flex;align-items:center;gap:calc(var(--u)*1);background:#16224f;border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*.8) calc(var(--u)*1.6);font-weight:800;font-size:calc(var(--u)*4.4)}
.chip img{width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);image-rendering:pixelated;border-radius:3px}
.chip.ok{opacity:.45}
#panel .tip{font-size:calc(var(--u)*3.6);color:#ffd34d;font-weight:800}
#gauge{position:relative;height:calc(var(--u)*3.4);background:rgba(10,16,48,.85);border:2px solid #7a6a2a;border-radius:calc(var(--u)*2);overflow:hidden}
#gauge i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff9a3a,#ffd34d)}
#gauge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.6);color:#fff;text-shadow:0 1px 0 #000;letter-spacing:.1em}
#gauge.on{border-color:#ffd34d;animation:glow .3s linear infinite alternate}
#tm{height:calc(var(--u)*1.8);background:rgba(10,16,48,.85);border-radius:calc(var(--u));overflow:hidden}
#tm i{display:block;height:100%;width:0;background:#4be08a}
#tm.low i{background:#ff4d6a}
#mult{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*34);font-weight:900;font-size:calc(var(--u)*10);color:#ffd34d;text-shadow:0 3px 0 #000,0 0 8px #ff7a1a;pointer-events:none}
#mult.b,#score.b{animation:bump .25s ease-out}
#score{display:inline-block;transform-origin:100% 50%}#mult{transform-origin:100% 50%}
#pops{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:calc(var(--u)*5);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap;animation:pop .8s ease-out forwards}
.pop.bad{color:#ff6b7f}.pop.gold{color:#ffd34d}.pop.dim{color:#cfd8f0}.pop.huge{font-size:calc(var(--u)*8)}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:calc(var(--u)*8);line-height:1.2;color:#ffd34d;text-shadow:0 3px 0 #000,0 0 10px #000;pointer-events:none;opacity:0;padding:0 calc(var(--u)*3)}
#banner.on{animation:banner 1.3s ease-out forwards}
#talk{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:36%;background:rgba(8,14,44,.95);border:3px solid #ffd34d;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);display:flex;gap:calc(var(--u)*2.6);align-items:flex-start;min-height:calc(var(--u)*34)}
#talk[hidden]{display:none}
#face{flex:none;width:calc(var(--u)*17);height:calc(var(--u)*17);image-rendering:pixelated;background:#16224f;border-radius:calc(var(--u)*2);border:2px solid #35b8f0}
#talk .tx{flex:1;text-align:left}
#tname{display:block;font-weight:900;font-size:calc(var(--u)*4.2);color:#7fd8ff;margin-bottom:calc(var(--u)*1)}
#ttext{font-size:calc(var(--u)*4.3);line-height:1.5;font-weight:600;word-break:keep-all}
#tnext{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*1.6);font-size:calc(var(--u)*3);color:#ffd34d;animation:glow .5s linear infinite alternate}
#skip{position:absolute;right:0;top:calc(var(--u)*-11);background:rgba(8,14,44,.9);border:2px solid #5b6aa0;border-radius:calc(var(--u)*2);padding:calc(var(--u)*1.6) calc(var(--u)*3);font-size:calc(var(--u)*3.4);color:#c9d4f2}
#bar{flex:none;height:var(--bar);width:min(100vw,calc((100vh - var(--bar))*9/16));width:min(100vw,calc((100dvh - var(--bar))*9/16));display:flex;align-items:center;justify-content:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 14px;background:#070b1c;touch-action:none;-webkit-user-select:none;user-select:none}
#mute{margin-right:auto;background:#141c3f;border:2px solid #35467a;border-radius:12px;padding:10px 12px;font-size:13px;color:#a9b8de}
#pad{display:flex;gap:14px}
#pad[hidden]{display:none}
#pad button{width:calc(var(--bar) - 18px);height:calc(var(--bar) - 18px);border-radius:50%;background:rgba(53,184,240,.3);border:3px solid rgba(127,216,255,.9);color:#fff;font-size:calc(var(--bar)*.36);font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
#pad button.on{background:rgba(53,184,240,.8);transform:scale(.94)}
#ov{position:absolute;inset:0;background:rgba(6,10,30,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3);padding:calc(var(--u)*6);text-align:center}
#ov[hidden]{display:none}
#ov h1{margin:0;font-size:calc(var(--u)*9.4);line-height:1.15;color:#ffd34d;text-shadow:0 3px 0 #1d3a8a}
#ov h1 small{display:block;font-size:calc(var(--u)*4);color:#7fd8ff;text-shadow:none;margin-bottom:calc(var(--u)*1.5)}
#ov p{margin:0;font-size:calc(var(--u)*3.9);line-height:1.55;color:#c9d4f2;word-break:keep-all}
#ov .btn{width:100%;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3.6);font-weight:800;font-size:calc(var(--u)*4.8);background:#35b8f0;color:#06183a}
#ov .btn:active{filter:brightness(1.3)}
#ov .btn.sub{background:#1c2a5e;color:#fff}
#ov .big{font-size:calc(var(--u)*13);font-weight:900;color:#ffd34d;line-height:1;font-variant-numeric:tabular-nums}
#ov .badge{border:3px solid #ffd34d;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.4) calc(var(--u)*5);font-weight:900;font-size:calc(var(--u)*5.4);color:#ffd34d;background:#1a2356}
#ov .fine{font-size:calc(var(--u)*3.2);color:#8e9cc4}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
@keyframes banner{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.18)}22%{transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1) translateY(-20%)}}
@keyframes bump{0%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.5)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="top"><span id="hearts"></span><span id="chap"></span><span id="score">0</span></div>
    <div id="panel"></div>
    <div id="tm"><i></i></div>
    <div id="gauge"><i></i><b>특급 조달 게이지</b></div>
  </div>
  <div id="mult"></div>
  <div id="pops"></div>
  <div id="banner"></div>
  <div id="talk" hidden><img id="face" alt=""><div class="tx"><b id="tname"></b><span id="ttext"></span></div><button id="skip">건너뛰기</button><span id="tnext">▼ 누르면 다음</span></div>
  <div id="ov"></div>
</div>
<div id="bar"><button id="mute">소리 켬</button><div id="pad" hidden></div></div>
<script>
'use strict';
// 달이의 조달 퀘스트. 그림과 소리는 모두 코드로 만든다(외부 파일 없음).
const W=180,H=320,GY=H-26;
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv');cv.width=W;cv.height=H;
let g=cv.getContext('2d');g.imageSmoothingEnabled=false;
function R(c,x,y,w,h){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function fit(){stage.style.setProperty('--u',stage.clientWidth/100+'px')}
addEventListener('resize',fit);fit();
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rnd=Math.random;

// ---------- 소리 ----------
let ac,master,nbuf,mute=store.get('pps.quest.mute','0')==='1';
function audio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const c=ac.createDynamicsCompressor();master=ac.createGain();master.gain.value=mute?0:.5;master.connect(c);c.connect(ac.destination);const n=ac.sampleRate*.5|0;nbuf=ac.createBuffer(1,n,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,d,type,when,vol,f2){const a=audio();if(!a)return;const o=a.createOscillator(),q=a.createGain(),t=a.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(vol||.12,t+.008);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d,freq,vol,when,type){const a=audio();if(!a)return;const s=a.createBufferSource(),f=a.createBiquadFilter(),q=a.createGain(),t=a.currentTime+(when||0);s.buffer=nbuf;f.type=type||'bandpass';f.frequency.value=freq;q.gain.setValueAtTime(vol||.15,t);q.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(q);q.connect(master);s.start(t);s.stop(t+d+.03)}
const sfx={
 get(c){const m=Math.pow(2,Math.min(c,14)/12);tone(130,.09,'sine',0,.3,55);noise(.04,3200,.1);tone(440*m,.1,'square',0,.1);tone(880*m,.13,'triangle',.03,.09)},
 gold(c){const m=Math.pow(2,(c%16)/12);tone(784*m,.08,'square',0,.07);tone(1568*m,.1,'triangle',.02,.06);noise(.03,5000,.05)},
 bad(){tone(160,.3,'sawtooth',0,.16,55);noise(.25,300,.25)},
 order(){tone(660,.08,'square',0,.08);tone(990,.12,'square',.09,.08)},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',i*.07,.11));tone(1047,.4,'triangle',.28,.15);tone(1319,.4,'triangle',.28,.1);noise(.3,6000,.06,.28)},
 fever(){for(let i=0;i<8;i++)tone(523*Math.pow(2,i/6),.09,'square',i*.045,.09);noise(.5,4000,.08,.3)},
 warn(){for(let i=0;i<3;i++){tone(880,.12,'square',i*.22,.1);tone(660,.1,'square',i*.22+.11,.1)}},
 big(){tone(90,.6,'sine',0,.4,35);noise(.5,200,.35,0,'lowpass');[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.16,'square',.1+i*.08,.11));tone(1568,.7,'triangle',.6,.16);tone(2093,.7,'triangle',.6,.1);noise(.6,7000,.07,.6)},
 perf(){tone(1760,.09,'triangle',0,.12);tone(2637,.16,'triangle',.05,.1)},
 tick(){tone(1200,.05,'square',0,.07)},
 late(){tone(220,.2,'square',0,.12);tone(165,.3,'square',.15,.12)},
 talk(){tone(520,.04,'square',0,.04)},
 heart(){tone(784,.1,'triangle',0,.12);tone(1175,.2,'triangle',.1,.12)},
 end(){[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',i*.16,.14))}
};
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
// 배경 음악: 16분음 32칸짜리 짧은 반복
const MEL=[0,null,4,7,null,7,9,7,4,null,7,12,null,9,7,null,5,null,9,12,null,12,14,12,7,null,11,14,null,12,11,null],BASS=[0,0,5,7];
let musT=0,step=0;
function music(dt){musT-=dt;if(musT>0)return;const c=C();musT+=feverT>0?c.bpm*.72:c.bpm;const s=step%32,n=MEL[s],tr=c.tr+(feverT>0?12:0);
 if(n!==null)tone(262*Math.pow(2,(n+tr)/12),.11,'square',0,.028);
 if(s%4===0)tone(131*Math.pow(2,(BASS[s>>3]+c.tr)/12),.2,'triangle',0,.07);
 if(s%2===1)noise(.03,6500,.02);if(s%8===4)noise(.07,1700,.045);step++}

// ---------- 물건 그림 (12x12) ----------
const ITEMS={
 eraser:{n:'지우개',c:['#f58fb0','#4a95e6'],d(x,y){R('#f58fb0',x+1,y+3,10,6);R('#4a95e6',x+1,y+3,4,6);R('#fff',x+5,y+4,1,4)}},
 desk:{n:'책상',c:['#b9743a','#d99a5b'],d(x,y){R('#b9743a',x,y+3,12,2);R('#8a5326',x+1,y+5,2,6);R('#8a5326',x+9,y+5,2,6);R('#d99a5b',x+3,y+5,6,3)}},
 pc:{n:'컴퓨터',c:['#5fd4f0','#2b3440'],d(x,y){R('#2b3440',x+1,y+1,10,7);R('#5fd4f0',x+2,y+2,8,5);R('#2b3440',x+5,y+8,2,2);R('#2b3440',x+3,y+10,6,1)}},
 helmet:{n:'소방 헬멧',c:['#e23b3b','#ffd34d'],d(x,y){R('#e23b3b',x+3,y+2,6,1);R('#e23b3b',x+2,y+3,8,5);R('#b52828',x+1,y+8,10,2);R('#ffd34d',x+5,y+4,2,3)}},
 kit:{n:'구급상자',c:['#fff','#e23b3b'],d(x,y){R('#8a96a3',x+4,y+1,4,2);R('#fff',x+1,y+3,10,8);R('#c9d1da',x+1,y+10,10,1);R('#e23b3b',x+5,y+4,2,6);R('#e23b3b',x+3,y+6,6,2)}},
 hose:{n:'소방 호스',c:['#d94433','#c9a23a'],d(x,y){R('#d94433',x+1,y+1,9,9);R('#eef2f7',x+3,y+3,5,5);R('#d94433',x+5,y+5,1,1);R('#c9a23a',x+8,y+9,4,2);R('#8a6a1a',x+11,y+9,1,2)}},
 drone:{n:'드론',c:['#8fa3b5','#35d0ba'],d(x,y){R('#cfe3f5',x,y+3,4,1);R('#cfe3f5',x+8,y+3,4,1);R('#5c6b7a',x+1,y+4,3,1);R('#5c6b7a',x+8,y+4,3,1);R('#8fa3b5',x+4,y+4,4,4);R('#35d0ba',x+5,y+5,2,1);R('#5c6b7a',x+4,y+8,1,2);R('#5c6b7a',x+7,y+8,1,2)}},
 robot:{n:'로봇',c:['#9fb3c8','#35d0ba'],d(x,y){R('#e23b3b',x+5,y,2,1);R('#9fb3c8',x+3,y+1,6,5);R('#35d0ba',x+4,y+3,1,1);R('#35d0ba',x+7,y+3,1,1);R('#7d8fa3',x+2,y+6,8,4);R('#ffd34d',x+5,y+7,2,2);R('#5c6b7a',x+3,y+10,2,2);R('#5c6b7a',x+7,y+10,2,2)}},
 solar:{n:'태양광 판',c:['#1f4fa8','#6fa8ff'],d(x,y){R('#1f4fa8',x+1,y+2,10,7);R('#6fa8ff',x+4,y+2,1,7);R('#6fa8ff',x+7,y+2,1,7);R('#6fa8ff',x+1,y+5,10,1);R('#8a96a3',x+5,y+9,2,2);R('#8a96a3',x+3,y+11,6,1)}},
 battery:{n:'수소 전지',c:['#2fb36b','#ffd34d'],d(x,y){R('#5c6b7a',x+4,y+1,4,2);R('#2fb36b',x+2,y+3,8,8);R('#208a50',x+2,y+10,8,1);R('#ffd34d',x+6,y+4,2,3);R('#ffd34d',x+4,y+6,4,1);R('#ffd34d',x+4,y+7,2,3)}}
};
function drawBad(x,y){R('#6b6f76',x+1,y+2,10,9);R('#4a4e55',x+1,y+2,10,1);for(let i=0;i<6;i++){R('#ff4d6a',x+3+i,y+4+i,1,1);R('#ff4d6a',x+8-i,y+4+i,1,1)}}
function drawGold(x,y,t){R('#b87a12',x,y,12,12);R('#ffd34d',x+1,y+1,10,10);R('#fff3b0',x+2,y+2,3,2);R('#e23b3b',x+5,y+1,2,10);R('#e23b3b',x+1,y+5,10,2);if(Math.sin(t*14+x)>0.3){R('#fff',x-2,y-2,2,2);R('#fff',x+12,y+10,2,2)}}
function tile(k,x,y,ring){R(ring?'#ffd34d':'#141c3a',x-2,y-2,16,16);R(k==='bad'?'#30343d':'#eef2f7',x-1,y-1,14,14);if(k==='bad')drawBad(x,y);else ITEMS[k].d(x,y)}
const ICON={};
(function(){const og=g;for(const k of Object.keys(ITEMS)){const c=document.createElement('canvas');c.width=c.height=14;g=c.getContext('2d');R('#eef2f7',0,0,14,14);ITEMS[k].d(1,1);ICON[k]=c.toDataURL()}g=og})();
// 큰 물건 (28x16)
const BIG={
 bus(x,y){R('#ffc93a',x,y+2,28,10);R('#e0a51f',x,y+11,28,2);for(let i=0;i<3;i++)R('#8fd8f5',x+2+i*7,y+4,5,4);R('#c98a12',x+23,y+4,4,8);R('#22252c',x+4,y+12,5,4);R('#22252c',x+19,y+12,5,4);R('#fff',x+26,y+9,2,2)},
 heli(x,y,t){const f=Math.sin(t*40)>0;R('#cfe3f5',x+(f?0:7),y,f?28:14,1);R('#555b66',x+13,y+1,2,2);R('#e23b3b',x+6,y+3,16,9);R('#fff',x+6,y+9,16,1);R('#8fd8f5',x+16,y+5,5,4);R('#e23b3b',x,y+5,7,3);R('#fff',x,y+3,2,5);R('#444a55',x+7,y+14,15,1);R('#444a55',x+9,y+12,1,2);R('#444a55',x+19,y+12,1,2)},
 sat(x,y){R('#1f4fa8',x,y+4,9,8);R('#1f4fa8',x+19,y+4,9,8);R('#6fa8ff',x+4,y+4,1,8);R('#6fa8ff',x+23,y+4,1,8);R('#6fa8ff',x,y+8,9,1);R('#6fa8ff',x+19,y+8,9,1);R('#c9d1da',x+10,y+3,8,11);R('#ffd34d',x+12,y+6,4,4);R('#8a96a3',x+13,y,2,3)},

 $('ov').innerHTML='<h1><small>지우개부터 헬리콥터까지</small>달이의<br>조달 퀘스트</h1><p>조달청 새내기 달이와 함께<br>나라에 필요한 물건을 딱 필요한 만큼 전해 주세요.</p><button class="btn" data-go="new">이야기 시작</button><button class="btn sub" data-go="end">끝없는 납품 (점수 도전)</button><p class="fine">오른쪽 아래 ◀ ▶ 버튼 · 화면 밀기 · 방향키'+(best?'<br>이야기 최고 '+best.toLocaleString():'')+(eb?' · 끝없는 납품 최고 '+eb.toLocaleString():'')+'</p>';$('ov').hidden=false}
$('ov').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;audio();const go=b.dataset.go;
 if(go==='menu')menu();else if(go==='end')startEndless();else if(go==='retry'){score=chScore;hearts=3;startCh()}
 else{score=0;hearts=3;mist=0;ch=0;bgI=0;endless=false;P.x=P.tx=W/2;$('ov').hidden=true;talk(0,startCh)}});

// ---------- 대화 ----------
let tl=null,ti=0,tn=0,tcb=null;
function talk(i,cb){state='talk';tl=TALK[i];ti=0;tcb=cb;$('pad').hidden=true;$('talk').hidden=false;line()}
function line(){const l=tl[ti];tn=0;$('face').src=FACE[l[0]];$('tname').textContent=l[0]==='n'?'나르미':'달이';$('ttext').textContent='';sfx.talk()}
function talkNext(){if(state!=='talk')return;const l=tl[ti];if(tn<l[1].length){tn=l[1].length;$('ttext').textContent=l[1];return}ti++;if(ti>=tl.length)talkEnd();else line()}
function talkEnd(){$('talk').hidden=true;const cb=tcb;tcb=null;tl=null;cb()}
$('skip').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();if(state==='talk')talkEnd()});

// ---------- 놀이 ----------
function catchIt(it){const by=GY-24;P.bounce=.14;
 if(it.gold){fc++;const gp=20*mult();score+=gp;punch=Math.max(punch,.025);pop('+'+gp,it.x+6,by-10,'gold');sfx.gold(fc);burst(it.x+6,by,['#ffd34d','#fff3b0','#fff'],7,120);ring(it.x+6,by,'#ffd34d',20,.25);beam(it.x+6,'#ffd34d',.18);edge('#ffd34d',.15);buzz(6);return}
 if(it.k==='bad'){hurt('불량품!',it.x+6,by-10);return}
 const o=order;if(!o||o.done)return;
 if(o.need[it.k]>0){o.need[it.k]--;combo++;const m=mult(),perf=Math.abs(it.x+6-P.x)<4.5,p=10*m*(perf?2:1);score+=p;P.stack.push(it.k);gauge=Math.min(1,gauge+(perf?1.5:1)/GAUGE_N);
  pop((perf?'퍼펙트! +':'+')+p,it.x+6,by-10,perf||m>1?'gold':'');if(combo%5===0)pop(combo<=20?'배율 x'+m+'!':combo+'콤보!',W/2,130,'gold huge');
  sfx.get(combo);if(perf)sfx.perf();buzz(perf?18:10);freeze=perf?.07:.05;punch=perf?.06:.035;burst(it.x+6,by,ITEMS[it.k].c.concat('#fff'),perf?18:10,perf?190:140);if(perf)flash('#ffffff',.1);
  {const c0=ITEMS[it.k].c[0],cx=it.x+6;ring(cx,by,c0,perf?54:34,.35);ring(cx,by,'#ffffff',perf?40:24,.28,.05);beam(cx,perf?'#ffffff':c0,perf?.35:.25);edge(perf?'#ffffff':c0,perf?.3:.2);
   if(perf||m>=3){ring(cx,by,'#ffd34d',perf?78:56,.5,.08);stars8(cx,by-6,'#ffd34d')}}
  if(Object.values(o.need).every(v=>v===0))orderDone();else panel()}
 else hurt(o.need[it.k]===0?'딱 필요한 만큼만!':'주문에 없는 물건!',it.x+6,by-10)}
function feverX(){return W/2-13+Math.sin(clock*2.4)*64}
function upd(dt){
 for(const t of timers.slice()){t.t-=dt;if(t.t<=0){timers.splice(timers.indexOf(t),1);t.fn();if(state!=='play')return}}
 if(P.dir)P.tx=Math.max(14,Math.min(W-14,P.tx+P.dir*190*dt));
 if(order&&!order.done&&feverT<=0){order.t-=dt;const tn=Math.ceil(order.t);if(order.t<3&&tn!==tickN){tickN=tn;sfx.tick()}
  if(order.t<=0){order.t=order.lim*.6;tickN=0;hurt('납품 지연!',W/2,110);sfx.late()}}
 if(mult()>1&&rnd()<dt*30*(mult()-1))parts.push({x:P.x-14+rnd()*28,y:GY-8,vx:(rnd()-.5)*30,vy:-40-rnd()*50,c:['#ffd34d','#ff9a3a','#ff5a2a','#fff'][rnd()*4|0],t:0,l:.3+rnd()*.3,s:mult()>3?2:1});
 P.x+=(P.tx-P.x)*Math.min(1,dt*20);if(P.bounce>0)P.bounce-=dt;
 if(gauge>=1&&feverT<=0&&order&&!order.done){feverT=FEVER;fc=0;gauge=0;for(const it of items){it.gold=true;it.k='gold'}banner('특급 조달 타임!');sfx.fever();flash('#ffd34d',.3);buzz([30,30,30])}
 spawnT-=dt;
 if(feverT>0){feverT-=dt;if(spawnT<=0){spawnT=.16;items.push({gold:true,k:'gold',x:Math.max(4,Math.min(W-16,feverX()+7+(rnd()-.5)*36)),y:74,v:100+rnd()*40})}
  if(feverT<=0){pop('특급 '+fc+'개!',W/2,120,'gold huge');spawnT=.7}}
 else if(order&&!order.done&&spawnT<=0){const c=C();spawnT=Math.max(.4,c.gap-ordI*.05);const need=Object.keys(order.need).filter(k=>order.need[k]>0);
  const k=c.bad&&rnd()<c.bad?'bad':need.length&&rnd()<.5?need[rnd()*need.length|0]:c.pool[rnd()*c.pool.length|0];
  items.push({k,x:8+rnd()*(W-28),y:56,v:(c.fall+(endless?0:ordI*4))*(.85+rnd()*.4),amp:bgI>=2||endless&&ordI>3?8+rnd()*14:0,ph:rnd()*6})}
 const by=GY-22;
 for(const it of items){it.y+=it.v*dt;
  if(!it.gold&&it.amp)it.x=Math.max(2,Math.min(W-14,it.x+Math.cos(clock*2.6+it.ph)*it.amp*2.6*dt));
  if(!it.dead&&it.y+12>=by&&it.y+12<=by+13&&Math.abs(it.x+6-P.x)<18){it.dead=true;catchIt(it)}
  if(it.y>GY-6&&!it.dead){it.dead=true;burst(it.x+6,GY-2,[it.gold?'#ffd34d':'#9aa7c7'],3,50)}}
 items=items.filter(i=>!i.dead);
 if(big){big.t+=dt;big.y+=48*dt;big.x=big.cx-14+Math.sin(big.t*2.2)*26;
  if(big.y+16>=by&&big.y+16<=by+14&&Math.abs(big.x+14-P.x)<23)bigCaught();
  else if(big.y>GY-8){burst(big.x+14,GY-4,['#9aa7c7','#fff'],10,90);pop('다시 한 번!',W/2,150,'dim');big=null;later(.7,()=>{big={k:C().big,cx:50+rnd()*80,x:0,y:40,t:0}})}}
 if(N){N.t+=dt;if(N.t>1.5)N=null}
 music(dt);
 if(hearts<=0)gameOver()}
function drawPlayer(){const x=P.x-11,b=P.bounce>0?2:0;
 dali(x,GY-36+b);
 P.stack.slice(-8).forEach((k,i)=>ITEMS[k].d(x-3+(i%4)*7,GY-31-(i>>2)*7+b));
 R('#5c3716',x-5,GY-22+b,32,2);R('#a8672f',x-4,GY-20+b,30,12-b);for(let i=0;i<5;i++)R('#8a5326',x-2+i*6,GY-20+b,1,12-b);R('#3a2410',x-1,GY-8,5,3);R('#3a2410',x+18,GY-8,5,3);
 if(P.big)BIG[P.big](P.x-14,GY-38+b,0)}
function draw(){
 g.save();if(shakeT>0)g.translate((rnd()*6-3)|0,(rnd()*6-3)|0);
 bg(state==='menu'?0:bgI,clock);if(portal)drawPortal(clock);
 if(state==='menu'){dali(52,GY-22);narmi(98,GY-28+Math.sin(clock*3)*2,Math.sin(clock*6)>0?0:1)}
 else{
  for(const it of items){if(it.gold)drawGold(it.x,it.y,clock);else tile(it.k,it.x,it.y,order&&!order.done&&order.need[it.k]>0)}
  drawPlayer();
  if(big){R('rgba(255,211,77,.35)',big.x-2,big.y-3,32,22);BIG[big.k](big.x,big.y,clock)}
  const fl=Math.sin(clock*24)>0?-3:1;
  if(state==='talk'||state==='end')narmi(Math.min(W-34,P.x+26),GY-74+Math.sin(clock*3)*3,Math.sin(clock*6)>0?0:1);
  else if(feverT>0)narmi(feverX(),50,fl);
  else if(N){const t=N.t;let nx,ny;if(t<.45){const e=t/.45;nx=-30+(N.px-13+30)*e;ny=90+(GY-66-90)*e*e}else{const e=(t-.45)/1.05;nx=N.px-13+(W+40-N.px)*e;ny=GY-66-(GY-110)*e*e}
   narmi(nx,ny,fl);if(t>=.45){R('#5c3716',nx+6,ny+24,14,2);R('#a8672f',nx+7,ny+26,12,8);R('#ffd34d',nx+12,ny+26,2,8)}}
  for(const e of fx){if(e.t<0)continue;const k=e.t/e.l;
   if(e.beam){g.globalAlpha=(1-k)*.45;const w=22*(1-k*.6);R(e.c,e.x-w/2,0,w,GY-20);g.globalAlpha=(1-k)*.7;R('#ffffff',e.x-w/6,0,w/3,GY-20)}
   else{const r=e.r*(1-(1-k)*(1-k));g.globalAlpha=1-k;g.strokeStyle=e.c;g.lineWidth=k<.5?3:2;g.beginPath();g.arc(e.x,e.y,r,0,7);g.stroke()}}
  g.globalAlpha=1;
  for(const p of parts)R(p.c,p.x,p.y,p.s,p.s);
  if(edgeT>0){const a=Math.max(0,edgeT/edgeD);for(let i=0;i<5;i++){g.globalAlpha=a*(.55-i*.1);const o=i*3;R(edgeC,o,o,W-2*o,3);R(edgeC,o,H-3-o,W-2*o,3);R(edgeC,o,o,3,H-2*o);R(edgeC,W-3-o,o,3,H-2*o)}g.globalAlpha=1}
  if(feverT>0){const a=.25+.2*Math.sin(clock*18);g.globalAlpha=a;R('#ffd34d',0,0,W,3);R('#ffd34d',0,H-3,W,3);R('#ffd34d',0,0,3,H);R('#ffd34d',W-3,0,3,H);g.globalAlpha=1}
 }
 g.restore();
 if(flashT>0){g.globalAlpha=Math.max(0,flashT/flashD)*.55;R(flashC,0,0,W,H);g.globalAlpha=1}}

// ---------- 조작 ----------
(function(){const p=$('pad');p.innerHTML='<button data-k="L" aria-label="왼쪽">◀</button><button data-k="R" aria-label="오른쪽">▶</button>';
 for(const b of p.querySelectorAll('button')){const d=b.dataset.k==='L'?-1:1;
  const set=v=>{b.classList.toggle('on',v);if(v)P.dir=d;else if(P.dir===d)P.dir=0};
  b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}audio();set(true)});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.stopPropagation();set(false)});
  b.addEventListener('contextmenu',e=>e.preventDefault())}})();
function setMute(){$('mute').textContent=mute?'소리 끔':'소리 켬';if(master)master.gain.value=mute?0:.5}
$('mute').addEventListener('click',()=>{mute=!mute;store.set('pps.quest.mute',mute?'1':'0');audio();setMute()});setMute();
function ptr(e){const r=stage.getBoundingClientRect();P.tx=Math.max(14,Math.min(W-14,(e.clientX-r.left)/r.width*W))}
stage.addEventListener('pointerdown',e=>{if(state==='talk'){audio();talkNext();return}if(state!=='play')return;ptr(e);try{stage.setPointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointermove',e=>{if(state==='play'&&(e.buttons||e.pointerType==='touch'))ptr(e)});
addEventListener('keydown',e=>{if(state==='talk'&&(e.key===' '||e.key==='Enter')){e.preventDefault();talkNext();return}if(state!=='play')return;if(e.key==='ArrowLeft'){P.dir=-1;e.preventDefault()}else if(e.key==='ArrowRight'){P.dir=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'&&P.dir===-1)P.dir=0;if(e.key==='ArrowRight'&&P.dir===1)P.dir=0});

let last=0;
function frame(ts){let dt=Math.max(0,Math.min(.05,(ts-last)/1000||0));last=ts;if(slow>0){slow-=dt;dt*=.3}clock+=dt;
 if(punch>0){punch=Math.max(0,punch-dt*.5);cv.style.transform=punch>0?'scale('+(1+punch)+')':''}
 if(shakeT>0)shakeT-=dt;if(flashT>0)flashT-=dt;
 if(freeze>0)freeze-=dt;
 else{if(state==='play')upd(dt);
  for(const p of parts){p.t+=dt;p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.t<p.l);for(const e of fx)e.t+=dt;fx=fx.filter(e=>e.t<e.l);if(edgeT>0)edgeT-=dt}
 if(state==='talk'&&tl){const l=tl[ti][1];if(tn<l.length){tn=Math.min(l.length,tn+dt*45);$('ttext').textContent=l.slice(0,tn|0)}}
 draw();
 if(state==='play'){if(score!==lastScore){lastScore=score;const e=$('score');e.textContent=score.toLocaleString();e.classList.remove('b');void e.offsetWidth;e.classList.add('b')}
  const m=mult();if(m!==lastMult){lastMult=m;const e=$('mult');e.textContent=m>1?'x'+m:'';e.classList.remove('b');void e.offsetWidth;e.classList.add('b')}
  const tb=$('tm');tb.classList.toggle('low',!!order&&order.t<3);tb.firstElementChild.style.width=(order&&!order.done?Math.max(0,order.t/order.lim)*100:0)+'%';const f=feverT>0;$('gauge').classList.toggle('on',f);$('gauge').firstElementChild.style.width=(f?feverT/FEVER:gauge)*100+'%';$('gauge').lastElementChild.textContent=f?'특급 조달 타임!':'특급 조달 게이지'}
 requestAnimationFrame(frame)}
menu();requestAnimationFrame(frame);
</script>
